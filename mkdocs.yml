site_name: ptp mesh
site_description: preset が違っても、マルチホップでも、島を跨いで届く実験的な Meshtastic MQTT ブリッジ
site_url: https://katsumoss.github.io/ptp-mesh-site/
repo_url: https://github.com/katsumoss/ptp-mesh-site
repo_name: katsumoss/ptp-mesh-site
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: ダークモードへ
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: ライトモードへ
  features:
    # ⚠ navigation.instant は i18n の言語切替リンク(同じページの別言語へ飛ぶ)と非互換なので外した
    - navigation.tracking
    - navigation.footer
    - content.action.edit
    - content.code.copy

nav:
  - ホーム: index.md
  - 参加方法: connect.md
  - グループとゲートウェイ: gateways.md
  - kbot（情報bot）: kbot.md
  - 防災チャンネル: bousai.md
  - 公式マップに載せる: map.md
  - リンク: links.md

plugins:
  # ⚠ plugins を書いた時点で既定の search が無効になるため明示的に並べる
  - search
  - i18n:
      docs_structure: suffix        # 日本語=拡張子なし(index.md) / 英語=index.en.md
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            ホーム: Home
            参加方法: Join
            グループとゲートウェイ: Groups and gateways
            kbot（情報bot）: kbot (info bot)
            防災チャンネル: Disaster channel
            公式マップに載せる: Public map
            リンク: Links

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - tables
  - attr_list

extra_css:
  - assets/gw.css

extra_javascript:
  - assets/gw.js
